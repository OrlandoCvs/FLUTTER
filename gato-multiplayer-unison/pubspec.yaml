name: gato_multiplayer
description: "Juego del Gato Multijugador - Universidad de Sonora"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  
  # Gestión de estado
  provider: ^6.1.1
  
  # Utilidades
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  uuid: ^4.2.1
  
  # Iconos Cupertino (iOS style)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  #  ASSETS A
  assets:
    - assets/images/logoUnison.jpg
    - assets/images/gato.png

#  ICONO DE LA APP
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/gato.png"
  min_sdk_android: 21